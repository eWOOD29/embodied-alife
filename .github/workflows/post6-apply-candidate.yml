name: post6-apply-candidate

on:
  push:
    branches:
      - agent/v0.4.0-post6-remediation

permissions:
  contents: write

concurrency:
  group: post6-apply-candidate
  cancel-in-progress: false

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: agent/v0.4.0-post6-remediation
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Reconstruct and apply exact candidate patch
        shell: bash
        run: |
          set -euo pipefail
          cat .post6-patch/part* > /tmp/post6.patch.bz2.b64
          echo "2104b674fe2b8225e459f4d7e169712e9c81d01df99a7d2c0b552d86476bfc28  /tmp/post6.patch.bz2.b64" | sha256sum -c -
          base64 -d /tmp/post6.patch.bz2.b64 | bzip2 -d > /tmp/post6.patch
          echo "7195fe0ce9b6979d1a44a91beadfad197ec2d16825ea75fa42c9dab8f40a259a  /tmp/post6.patch" | sha256sum -c -
          git apply --index --check /tmp/post6.patch
          git apply --index /tmp/post6.patch
          git rm -r .post6-patch .github/workflows/post6-apply-candidate.yml
      - name: Install candidate dependencies
        run: python -m pip install -e '.[dev]'
      - name: Focused Post6 exploit and semantic suite
        run: python -m pytest -q tests/test_v040_post6_remediation.py
      - name: Retained Post5 and Post4 semantic suites
        run: >-
          python -m pytest -q
          tests/test_v040_remediation.py
          tests/test_v040_post3_remediation.py
          tests/test_v040_post4_remediation.py
          tests/test_v040_post5_remediation.py
          tests/test_v040_post6_version.py
      - name: Complete pytest suite
        run: python -m pytest -q
      - name: Compile
        run: python -m compileall -q app tests scripts
      - name: Advisory Ruff delta
        shell: bash
        run: |
          set +e
          python -m ruff check app tests scripts | tee /tmp/post6-ruff.log
          status=${PIPESTATUS[0]}
          echo "POST6_RUFF_EXIT=${status}"
          exit 0
      - name: Clean generated validation files
        shell: bash
        run: |
          find app tests scripts -type d -name __pycache__ -prune -exec rm -rf {} +
          rm -rf .pytest_cache .ruff_cache dist
          find data/runtime -maxdepth 1 -type f ! -name .gitkeep -delete
      - name: Validate source package and privacy
        shell: bash
        run: |
          PYTHONDONTWRITEBYTECODE=1 python scripts/validate_package.py
          PYTHONDONTWRITEBYTECODE=1 python - <<'PY'
          from pathlib import Path
          from scripts.privacy_scan import scan_tree
          findings = scan_tree(Path('.').resolve(), include_runtime=False)
          print(f'raw_privacy_findings={len(findings)}')
          if findings:
              raise SystemExit('\n'.join(findings))
          PY
      - name: Updater, installer, and version compatibility
        run: python -m pytest -q tests/test_v040_post6_version.py tests/test_updater.py tests/test_update_shutdown.py
      - name: Build and reconcile local candidate archive
        shell: bash
        run: |
          python scripts/build_release.py --output dist/embodied-alife-update.zip
          python - <<'PY'
          import hashlib
          import json
          import tempfile
          import zipfile
          from pathlib import Path
          from scripts.privacy_scan import scan_tree
          root = Path('.').resolve()
          archive_path = root / 'dist' / 'embodied-alife-update.zip'
          checksum_path = root / 'dist' / 'embodied-alife-update.zip.sha256'
          digest = hashlib.sha256(archive_path.read_bytes()).hexdigest()
          expected = checksum_path.read_text(encoding='utf-8').split()[0]
          assert digest == expected
          with zipfile.ZipFile(archive_path) as archive:
              assert archive.testzip() is None
              names = archive.namelist()
              assert len(names) == len(set(names))
              manifest = json.loads(archive.read('update-manifest.json'))
              assert manifest['version'] == '0.4.0.post6'
              members = sorted(name for name in names if name != 'update-manifest.json')
              assert members == sorted(manifest['managed_paths'])
              forbidden = [name for name in names if '.post6-patch' in name or 'post6-apply-candidate' in name or 'post6-pr-export' in name or 'post6-source-export' in name or '__pycache__' in name or name.endswith('.pyc')]
              assert not forbidden, forbidden
              with tempfile.TemporaryDirectory() as temp:
                  archive.extractall(temp)
                  findings = scan_tree(Path(temp), include_runtime=True)
                  print(f'decoded_privacy_findings={len(findings)}')
                  if findings:
                      raise SystemExit('\n'.join(findings))
          print(f'archive_sha256={digest}')
          print(f'archive_members={len(names)}')
          print(f'managed_paths={len(manifest["managed_paths"])}')
          PY
      - name: Remove generated evidence and verify final tree
        shell: bash
        run: |
          rm -rf dist .pytest_cache .ruff_cache
          find app tests scripts -type d -name __pycache__ -prune -exec rm -rf {} +
          find data/runtime -maxdepth 1 -type f ! -name .gitkeep -delete
          git diff --cached --check
          test -z "$(git status --short | grep -E '(^|/)(__pycache__|\.pytest_cache|\.ruff_cache|dist|\.post6-patch)(/|$)|post6-(apply-candidate|pr-export|source-export)' || true)"
      - name: Commit and push exact candidate
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Implement v0.4.0.post6 remediation candidate"
          git push origin HEAD:agent/v0.4.0-post6-remediation
