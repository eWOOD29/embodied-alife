name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Focused Post6 exploit and semantic suite
        run: >-
          python -m pytest -q
          tests/test_v040_post6_remediation.py
          tests/test_v040_post6_version.py
          tests/test_v040_post5_remediation.py
          tests/test_v040_post4_remediation.py
          tests/test_v040_post3_remediation.py
          tests/test_v040_remediation.py
          tests/test_v040_cognitive_foundations.py
      - name: Complete test suite
        run: python -m pytest -q
      - name: Compile
        run: python -m compileall -q app tests scripts
      - name: Advisory Ruff
        continue-on-error: true
        run: python -m ruff check app tests scripts
      - name: Clean generated validation files
        shell: bash
        run: |
          find app tests scripts -type d -name __pycache__ -prune -exec rm -rf {} +
          rm -rf .pytest_cache .ruff_cache
          find data/runtime -maxdepth 1 -type f ! -name .gitkeep -delete
      - name: Validate source package
        run: python scripts/validate_package.py
      - name: Build local candidate archive
        run: python scripts/build_release.py --output dist/embodied-alife-update.zip
      - name: Reconcile archive, manifest, checksum, hygiene, and privacy
        run: python scripts/validate_candidate_archive.py dist/embodied-alife-update.zip
