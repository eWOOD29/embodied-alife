name: tests

on:
  push:
  pull_request:

permissions:
  contents: write
  actions: write
  pull-requests: read

jobs:
  test:
    if: github.event_name != 'pull_request' || github.head_ref != 'ops/post8-release-finalization-3fb63ef'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Focused Post8 persistence, malformed-terrain, and retained semantic suite
        run: >-
          python -m pytest -q
          tests/test_v040_post8_remediation.py
          tests/test_v040_post8_version.py
          tests/test_v040_post7_remediation.py
          tests/test_v040_post7_version.py
          tests/test_v040_post6_remediation.py
          tests/test_v040_post6_version.py
          tests/test_v040_post5_remediation.py
          tests/test_v040_post4_remediation.py
          tests/test_v040_post3_remediation.py
          tests/test_v040_remediation.py
          tests/test_v040_cognitive_foundations.py
      - name: Complete test suite
        run: python -m pytest -q
      - name: Compile
        run: python -m compileall -q app tests scripts
      - name: Advisory Ruff
        continue-on-error: true
        run: python -m ruff check app tests scripts
      - name: Clean generated validation files
        shell: bash
        run: |
          find app tests scripts -type d -name __pycache__ -prune -exec rm -rf {} +
          rm -rf .pytest_cache .ruff_cache
          find data/runtime -maxdepth 1 -type f ! -name .gitkeep -delete
      - name: Validate source package
        run: python scripts/validate_package.py
      - name: Build local candidate archive
        run: python scripts/build_release.py --output dist/embodied-alife-update.zip
      - name: Reconcile archive, manifest, checksum, hygiene, and privacy
        run: python scripts/validate_candidate_archive.py dist/embodied-alife-update.zip

  post8_release_finalization:
    if: github.event_name == 'pull_request' && github.head_ref == 'ops/post8-release-finalization-3fb63ef'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: eWOOD29/embodied-alife
      TEMP_BRANCH: ops/post8-release-finalization-3fb63ef
      CANDIDATE_SHA: 3fb63ef571f9bda5a6709d78a5acb68c28e4786e
      POST7_SHA: 7fd1e3eaea1048cdc4b8ddc0072a4c2fdb5bcb6e
      BASE_SHA: a51d589268cd889d5f84c5c611c4e08cb3a25602
      TAG: v0.4.0.post8
      ARTIFACT_ID: "8623114889"
      OUTER_SHA256: fe05afd146f75a0229aab3cdfbbcb8b7cf1f7846f2b53acef7864010fa4f7f73
      UPDATE_SHA256: 4f44cbaa76786136fa6e62e3d2f7517cf0574849b672e67185ddfa64b831c483
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ops/post8-release-finalization-3fb63ef
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Recover, harden redirects, run, and retain diagnostic output
        shell: bash
        run: |
          set +e
          {
            python - <<'PY'
          import base64, gzip, hashlib
          from pathlib import Path
          parts = sorted(Path('.release-finalizer-payload').glob('part-*.txt'))
          if [path.name for path in parts] != [f'part-{index:02d}.txt' for index in range(1, 6)]:
              raise SystemExit(f'unexpected payload parts: {[path.name for path in parts]}')
          encoded = ''.join(path.read_text(encoding='utf-8').strip() for path in parts)
          data = gzip.decompress(base64.b64decode(encoded, validate=True))
          original_digest = hashlib.sha256(data).hexdigest()
          if original_digest != 'd9ef2afd461a7e0d692338c23537c6f7b079d197b114c2e94aadef5f7341e9a4':
              raise SystemExit(f'original finalizer payload digest mismatch: {original_digest}')

          artifact_old = b'''    _, outer_bytes, _ = api(\n        f"/repos/{REPO}/actions/artifacts/{ARTIFACT_ID}/zip",\n        accept="application/octet-stream",\n        expected=(200,),\n        parse_json=False,\n    )'''
          artifact_new = b'''    _, outer_bytes, _ = api(\n        f"/repos/{REPO}/actions/artifacts/{ARTIFACT_ID}/zip",\n        accept="application/vnd.github+json",\n        expected=(200,),\n        parse_json=False,\n    )'''
          if data.count(artifact_old) != 1:
              raise SystemExit(f'unexpected artifact download block occurrence count: {data.count(artifact_old)}')
          data = data.replace(artifact_old, artifact_new)

          redirect_anchor = b'''def sha256(data: bytes) -> str:\n    return hashlib.sha256(data).hexdigest()\n\ndef request_url('''
          redirect_insert = b'''def sha256(data: bytes) -> str:\n    return hashlib.sha256(data).hexdigest()\n\nclass StripAuthOnCrossHostRedirect(urllib.request.HTTPRedirectHandler):\n    def redirect_request(self, req, fp, code, msg, headers, newurl):\n        redirected = super().redirect_request(req, fp, code, msg, headers, newurl)\n        if redirected is not None and urllib.parse.urlparse(req.full_url).netloc != urllib.parse.urlparse(newurl).netloc:\n            redirected.remove_header("Authorization")\n            redirected.remove_header("X-GitHub-Api-Version")\n        return redirected\n\nOPENER = urllib.request.build_opener(StripAuthOnCrossHostRedirect())\n\ndef request_url('''
          if data.count(redirect_anchor) != 1:
              raise SystemExit(f'unexpected redirect insertion anchor count: {data.count(redirect_anchor)}')
          data = data.replace(redirect_anchor, redirect_insert)

          urlopen_old = b'with urllib.request.urlopen(req, timeout=120) as resp:'
          urlopen_new = b'with OPENER.open(req, timeout=120) as resp:'
          if data.count(urlopen_old) != 1:
              raise SystemExit(f'unexpected urlopen call count: {data.count(urlopen_old)}')
          data = data.replace(urlopen_old, urlopen_new)

          patched_digest = hashlib.sha256(data).hexdigest()
          if patched_digest != 'bdc088aeba8b5489c6fef033d2e407fb7b336470425772e6ef1dfe09963a584d':
              raise SystemExit(f'patched finalizer payload digest mismatch: {patched_digest}')
          Path('/tmp/post8_finalize.py').write_bytes(data)
          PY
            python -m py_compile /tmp/post8_finalize.py
            python /tmp/post8_finalize.py
          } > /tmp/release-finalization-debug.log 2>&1
          rc=$?
          set -e
          cp /tmp/release-finalization-debug.log release-finalization-debug.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add release-finalization-debug.log
          git commit -m "Record Post8 finalization diagnostic" || true
          git push origin "HEAD:${TEMP_BRANCH}"
          cat /tmp/release-finalization-debug.log
          exit "$rc"
