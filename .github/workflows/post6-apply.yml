name: post6-apply

on:
  push:
    branches:
      - agent/v0.4.0-post6-remediation

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/v0.4.0-post6-remediation
          fetch-depth: 0
      - name: Apply frozen candidate patch
        shell: bash
        run: |
          set -euo pipefail
          cat .post6-patch/gz-chunk-00.b64 .post6-patch/gz-chunk-01.b64 .post6-patch/gz-chunk-02.b64 | base64 --decode > /tmp/post6.patch.gz
          echo "236ddd289f7b14b95f031aabdbe1e718aff2e01ff579122f8a31d0380eddac42  /tmp/post6.patch.gz" | sha256sum -c -
          gzip -dc /tmp/post6.patch.gz > /tmp/post6.patch
          git apply --index /tmp/post6.patch
          rm -rf .post6-patch
          rm -f .github/workflows/post6-apply.yml
          git add -A
          git diff --cached --check
          git config user.name "OpenAI"
          git config user.email "openai@users.noreply.github.com"
          git commit -m "Remediate Post6 trust boundaries and malformed active state"
          git push origin HEAD:agent/v0.4.0-post6-remediation
