name: post6-history-export

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  export:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/v0.4.0-post6-remediation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          show-progress: false
          ref: agent/v0.4.0-post6-remediation
      - uses: actions/upload-artifact@v4
        with:
          name: post6-history-export
          path: .
          include-hidden-files: true
          retention-days: 1
