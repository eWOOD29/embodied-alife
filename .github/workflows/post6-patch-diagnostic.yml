name: post6-patch-diagnostic

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  apply-diagnostic:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/v0.4.0-post6-remediation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          show-progress: false
          ref: agent/v0.4.0-post6-remediation
      - name: Diagnose exact patch preconditions
        shell: bash
        run: |
          set +e
          cat .post6-patch/part* > /tmp/post6.patch.bz2.b64
          base64 -d /tmp/post6.patch.bz2.b64 | bzip2 -d > /tmp/post6.patch
          git apply --check --verbose /tmp/post6.patch > /tmp/worktree.out 2>&1
          worktree_status=$?
          git apply --index --check --verbose /tmp/post6.patch > /tmp/index.out 2>&1
          index_status=$?
          rm -rf /tmp/post6-diag
          git clone --quiet --no-local . /tmp/post6-diag
          cd /tmp/post6-diag
          git checkout --quiet agent/v0.4.0-post6-remediation
          git apply --3way --index /tmp/post6.patch > /tmp/threeway.out 2>&1
          threeway_status=$?
          {
            echo "PATCH_B64_SHA=$(sha256sum /tmp/post6.patch.bz2.b64 | cut -d' ' -f1)"
            echo "PATCH_SHA=$(sha256sum /tmp/post6.patch | cut -d' ' -f1)"
            echo "WORKTREE_CHECK_EXIT=${worktree_status}"
            cat /tmp/worktree.out
            echo "INDEX_CHECK_EXIT=${index_status}"
            cat /tmp/index.out
            echo "THREEWAY_EXIT=${threeway_status}"
            cat /tmp/threeway.out
          } > /tmp/post6-patch-diagnostic.txt
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: post6-patch-diagnostic
          path: /tmp/post6-patch-diagnostic.txt
          retention-days: 1
