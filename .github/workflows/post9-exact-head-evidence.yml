name: post9-exact-head-evidence

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-head-evidence:
    runs-on: ubuntu-latest
    env:
      CANDIDATE_SHA: 1dfe98f4f9910a7e3a21c925b05ae87bc5403edc
      BASE_SHA: 65ed0a371ed1257254ac9f2f0777e17244ecf122
    steps:
      - name: Checkout exact frozen candidate
        uses: actions/checkout@v5
        with:
          ref: 1dfe98f4f9910a7e3a21c925b05ae87bc5403edc
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact identity and clean source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence dist
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(git rev-parse HEAD^)" = "$BASE_SHA"
          test "$(git rev-list --count "$BASE_SHA"..HEAD)" = "1"
          test "$(git diff --name-only "$BASE_SHA"..HEAD | wc -l | tr -d ' ')" = "9"
          test -z "$(git status --porcelain)"
          git rev-parse HEAD > evidence/candidate-sha.txt
          git rev-parse HEAD^ > evidence/parent-sha.txt
          git rev-parse HEAD^{tree} > evidence/tree-sha.txt
          git diff --name-only "$BASE_SHA"..HEAD | sort > evidence/changed-files.txt
          git show --no-patch --format=fuller HEAD > evidence/commit.txt

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: python -m pip install -e '.[dev]'

      - name: Focused Post9 and retained semantic matrix
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q \
            tests/test_v040_post9_remediation.py \
            tests/test_v040_post9_version.py \
            tests/test_v040_post8_remediation.py \
            tests/test_v040_post8_version.py \
            tests/test_v040_post7_remediation.py \
            tests/test_v040_post7_version.py \
            tests/test_v040_post6_remediation.py \
            tests/test_v040_post6_version.py \
            tests/test_v040_post5_remediation.py \
            tests/test_v040_post4_remediation.py \
            tests/test_v040_post3_remediation.py \
            tests/test_v040_remediation.py \
            tests/test_v040_cognitive_foundations.py \
            2>&1 | tee evidence/focused-tests.log

      - name: Compatibility matrix
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(find tests -maxdepth 1 -type f \( -iname '*version*.py' -o -iname '*updat*.py' -o -iname '*install*.py' -o -iname '*config*.py' \) | sort)
          test "${#files[@]}" -gt 0
          printf '%s\n' "${files[@]}" > evidence/compatibility-files.txt
          python -m pytest -q "${files[@]}" 2>&1 | tee evidence/compatibility-tests.log

      - name: Complete suite
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q 2>&1 | tee evidence/full-suite.log

      - name: Compilation and advisory Ruff
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q app tests scripts
          printf 'PASS\n' > evidence/compileall.txt
          set +e
          python -m ruff check app tests scripts > evidence/ruff.log 2>&1
          ruff_status=$?
          set -e
          printf '%s\n' "$ruff_status" > evidence/ruff-exit-code.txt

      - name: Clean generated validation files
        shell: bash
        run: |
          find app tests scripts -type d -name __pycache__ -prune -exec rm -rf {} +
          rm -rf .pytest_cache .ruff_cache
          find data/runtime -maxdepth 1 -type f ! -name .gitkeep -delete

      - name: Validate source package
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_package.py 2>&1 | tee evidence/source-package-validation.log

      - name: Build and validate exact updater archive
        shell: bash
        run: |
          set -euo pipefail
          python scripts/build_release.py --output dist/embodied-alife-update.zip 2>&1 | tee evidence/build-release.log
          python scripts/validate_candidate_archive.py dist/embodied-alife-update.zip 2>&1 | tee evidence/candidate-archive-validation.log

      - name: Generate machine-readable exact-head summary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations
          import hashlib
          import json
          import os
          import re
          import subprocess
          import tomllib
          import zipfile
          from pathlib import Path, PurePosixPath

          root = Path.cwd()
          evidence = root / 'evidence'
          archive_path = root / 'dist' / 'embodied-alife-update.zip'
          archive_bytes = archive_path.read_bytes()
          archive_sha = hashlib.sha256(archive_bytes).hexdigest()

          with zipfile.ZipFile(archive_path) as archive:
              names = archive.namelist()
              manifest = json.loads(archive.read('update-manifest.json'))
              managed = manifest['managed_paths']
              unsafe = []
              mismatches = []
              for name in names:
                  p = PurePosixPath(name)
                  if p.is_absolute() or '..' in p.parts or '\\' in name:
                      unsafe.append(name)
              for path in managed:
                  source = root / Path(path)
                  if not source.is_file():
                      mismatches.append({'path': path, 'reason': 'missing_source'})
                      continue
                  try:
                      member = archive.read(path)
                  except KeyError:
                      mismatches.append({'path': path, 'reason': 'missing_archive_member'})
                      continue
                  if member != source.read_bytes():
                      mismatches.append({'path': path, 'reason': 'byte_mismatch'})

          def summary_line(name: str) -> str:
              text = (evidence / name).read_text(encoding='utf-8', errors='replace')
              lines = [line.strip() for line in text.splitlines() if line.strip()]
              for line in reversed(lines):
                  if re.search(r'\b(passed|failed|error|skipped|xfailed|xpassed)\b', line):
                      return line
              return lines[-1] if lines else ''

          candidate = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          parent = subprocess.check_output(['git', 'rev-parse', 'HEAD^'], text=True).strip()
          tree = subprocess.check_output(['git', 'rev-parse', 'HEAD^{tree}'], text=True).strip()
          changed = subprocess.check_output(['git', 'diff', '--name-only', os.environ['BASE_SHA'], 'HEAD'], text=True).splitlines()
          pyproject_version = tomllib.loads((root / 'pyproject.toml').read_text(encoding='utf-8'))['project']['version']
          version_text = (root / 'app' / 'version.py').read_text(encoding='utf-8')
          runtime_match = re.search(r'__version__\s*=\s*[\"\']([^\"\']+)', version_text)
          runtime_version = runtime_match.group(1) if runtime_match else None

          summary = {
              'candidate_sha': candidate,
              'base_sha': os.environ['BASE_SHA'],
              'parent_sha': parent,
              'tree_sha': tree,
              'commit_count': int(subprocess.check_output(['git', 'rev-list', '--count', f"{os.environ['BASE_SHA']}..HEAD"], text=True)),
              'changed_files': sorted(changed),
              'changed_file_count': len(changed),
              'runtime_version': runtime_version,
              'package_version': pyproject_version,
              'focused_summary': summary_line('focused-tests.log'),
              'compatibility_summary': summary_line('compatibility-tests.log'),
              'full_suite_summary': summary_line('full-suite.log'),
              'compileall': 'PASS',
              'ruff_exit_code': int((evidence / 'ruff-exit-code.txt').read_text().strip()),
              'source_package_validation': 'PASS',
              'candidate_archive_validation': 'PASS',
              'updater_zip': {
                  'filename': archive_path.name,
                  'size_bytes': len(archive_bytes),
                  'sha256': archive_sha,
                  'member_count': len(names),
                  'unique_member_count': len(set(names)),
                  'managed_path_count': len(managed),
                  'manifest_version': manifest.get('version'),
                  'unsafe_paths': unsafe,
                  'source_equivalence_mismatches': mismatches,
              },
          }
          assert candidate == os.environ['CANDIDATE_SHA']
          assert parent == os.environ['BASE_SHA']
          assert summary['commit_count'] == 1
          assert summary['changed_file_count'] == 9
          assert runtime_version == '0.4.0.post9' == pyproject_version == manifest.get('version')
          assert len(names) == len(set(names))
          assert not unsafe
          assert not mismatches

          (evidence / 'summary.json').write_text(json.dumps(summary, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          (evidence / 'embodied-alife-update.zip').write_bytes(archive_bytes)
          (evidence / 'embodied-alife-update.zip.sha256').write_text(f'{archive_sha}  embodied-alife-update.zip\n', encoding='utf-8')
          PY
          cat evidence/summary.json

      - name: Upload retained exact-head evidence
        uses: actions/upload-artifact@v4
        with:
          name: post9-exact-head-evidence-1dfe98f
          path: evidence/
          if-no-files-found: error
          retention-days: 90
