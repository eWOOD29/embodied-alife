name: post9-bootstrap

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'ops/post9-bootstrap'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Verify patch and stage non-workflow tree
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/post9-bootstrap-diagnostics
          cat .post9-bootstrap/0* > /tmp/post9.diff.xz.b64
          echo '0adb361684361471e51a85be53662c0730f41634ffe3330742217ded873dfa53  /tmp/post9.diff.xz.b64' | sha256sum -c - | tee /tmp/post9-bootstrap-diagnostics/transfer.txt
          base64 -d /tmp/post9.diff.xz.b64 > /tmp/post9.diff.xz
          echo 'c282ce09bde5bc34ddd23fd642efc631d90fff70ad7ff38fe8128ac42fcc6ea4  /tmp/post9.diff.xz' | sha256sum -c - | tee -a /tmp/post9-bootstrap-diagnostics/transfer.txt
          xz -dc /tmp/post9.diff.xz > /tmp/post9.diff
          echo '617ab351de6d3f08680026a9b329a2f1c0592a5b88198f49b45e366a7710f7ad  /tmp/post9.diff' | sha256sum -c - | tee -a /tmp/post9-bootstrap-diagnostics/transfer.txt
          git fetch origin ops/post9-staged-code
          git checkout -B post9-staged origin/ops/post9-staged-code
          test "$(git rev-parse HEAD)" = '65ed0a371ed1257254ac9f2f0777e17244ecf122'
          git apply --check /tmp/post9.diff
          git apply /tmp/post9.diff
          git restore .github/workflows/tests.yml
          git add CHANGELOG.md app/simulation/scheduler.py app/version.py pyproject.toml scripts/validate_candidate_archive.py tests/test_v040_post8_version.py tests/test_v040_post9_remediation.py tests/test_v040_post9_version.py
          git diff --cached --name-only | tee /tmp/post9-bootstrap-diagnostics/changed-files.txt
          test "$(git diff --cached --name-only | wc -l)" = '8'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Stage Post9 non-workflow candidate tree'
          git push origin HEAD:ops/post9-staged-code
      - name: Upload bootstrap diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: post9-bootstrap-diagnostics
          path: /tmp/post9-bootstrap-diagnostics
          if-no-files-found: warn
          retention-days: 1
