name: post8-published-byte-audit-retry-evidence

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  acquire-and-verify:
    if: github.event.pull_request.head.ref == 'audit/post8-published-byte-retry'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      REPO: eWOOD29/embodied-alife
      TAG: v0.4.0.post8
      CANDIDATE_SHA: 3fb63ef571f9bda5a6709d78a5acb68c28e4786e
      MERGE_SHA: 65ed0a371ed1257254ac9f2f0777e17244ecf122
      BASE_SHA: a51d589268cd889d5f84c5c611c4e08cb3a25602
      TREE_SHA: 98a54f8b4155921bf65a5bc8913040d63a7ae57c
      REQUIRED_UPDATE_SHA: 4f44cbaa76786136fa6e62e3d2f7517cf0574849b672e67185ddfa64b831c483
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Acquire live public objects and exact public bytes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          api() {
            curl --retry 4 --retry-all-errors -fsSL \
              -H 'Accept: application/vnd.github+json' \
              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/${REPO}$1"
          }
          api "/releases/tags/${TAG}" > evidence/release-tag.json
          api "/releases/latest" > evidence/release-latest.json
          api "/releases?per_page=100" > evidence/releases-all.json
          api "/tags?per_page=100" > evidence/tags-all.json
          api "/events?per_page=100&page=1" > evidence/events-1.json
          api "/events?per_page=100&page=2" > evidence/events-2.json
          api "/events?per_page=100&page=3" > evidence/events-3.json
          api "/pulls/24" > evidence/pr-24.json
          api "/pulls/26" > evidence/pr-26.json
          api "/pulls/27" > evidence/pr-27.json
          api "/commits/${CANDIDATE_SHA}" > evidence/candidate-commit.json
          api "/commits/${MERGE_SHA}" > evidence/merge-commit.json
          api "/commits/${TAG}" > evidence/tag-commit.json
          api "/branches/main" > evidence/main-branch.json
          api "/branches/ops%2Fpost8-release-finalization-3fb63ef" > evidence/controller-branch.json
          api "/git/ref/tags/${TAG}" > evidence/tag-ref.json

          curl --retry 4 --retry-all-errors -fsSL \
            "https://github.com/${REPO}/releases/download/${TAG}/embodied-alife-update.zip" \
            -o evidence/tag-updater.zip
          curl --retry 4 --retry-all-errors -fsSL \
            "https://github.com/${REPO}/releases/download/${TAG}/embodied-alife-update.zip.sha256" \
            -o evidence/tag-updater.zip.sha256
          curl --retry 4 --retry-all-errors -fsSL \
            "https://github.com/${REPO}/releases/latest/download/embodied-alife-update.zip" \
            -o evidence/latest-updater.zip

          git worktree add --detach "${RUNNER_TEMP}/post8-tag-source" "${TAG}"
          printf '%s' "${RUNNER_TEMP}/post8-tag-source" > evidence/tag-source-path.txt

      - name: Analyze public bytes, source equivalence, updater path, privacy, cleanup, and history
        shell: bash
        run: |
          set -euo pipefail
          export TAG_SOURCE="$(cat evidence/tag-source-path.txt)"
          cat > /tmp/post8_audit_retry.py <<'PY'
          from __future__ import annotations

          import hashlib
          import importlib.util
          import json
          import os
          import stat
          import subprocess
          import sys
          import tempfile
          import zipfile
          from datetime import datetime, timezone
          from pathlib import Path, PurePosixPath

          E = Path('evidence')
          SOURCE = Path(os.environ['TAG_SOURCE'])
          REQUIRED = os.environ['REQUIRED_UPDATE_SHA']
          CANDIDATE = os.environ['CANDIDATE_SHA']
          MERGE = os.environ['MERGE_SHA']
          BASE = os.environ['BASE_SHA']
          TREE = os.environ['TREE_SHA']
          TAG = os.environ['TAG']
          EXPECTED_CHECKSUM = f'{REQUIRED}  embodied-alife-update.zip\n'
          RESERVED = {'CON','PRN','AUX','NUL'} | {f'COM{i}' for i in range(1,10)} | {f'LPT{i}' for i in range(1,10)}

          def load(name: str):
              return json.loads((E / name).read_text(encoding='utf-8'))

          def sha(path: Path) -> str:
              h = hashlib.sha256()
              with path.open('rb') as handle:
                  for chunk in iter(lambda: handle.read(1024 * 1024), b''):
                      h.update(chunk)
              return h.hexdigest()

          failures: list[str] = []
          def check(value: bool, label: str) -> None:
              if not value:
                  failures.append(label)

          release = load('release-tag.json')
          latest = load('release-latest.json')
          releases = load('releases-all.json')
          tags = load('tags-all.json')
          events = load('events-1.json') + load('events-2.json') + load('events-3.json')
          pr24, pr26, pr27 = load('pr-24.json'), load('pr-26.json'), load('pr-27.json')
          candidate_commit = load('candidate-commit.json')
          merge_commit = load('merge-commit.json')
          tag_commit = load('tag-commit.json')
          main_branch = load('main-branch.json')
          controller_branch = load('controller-branch.json')
          tag_ref = load('tag-ref.json')

          tag_zip = E / 'tag-updater.zip'
          latest_zip = E / 'latest-updater.zip'
          checksum_file = E / 'tag-updater.zip.sha256'
          tag_sha = sha(tag_zip)
          latest_sha = sha(latest_zip)
          checksum_text = checksum_file.read_text(encoding='utf-8')

          assets = {asset['name']: asset for asset in release.get('assets', [])}
          updater_asset = assets.get('embodied-alife-update.zip', {})
          checksum_asset = assets.get('embodied-alife-update.zip.sha256', {})

          check(release.get('id') == 359896955, 'release ID mismatch')
          check(release.get('tag_name') == TAG, 'release tag mismatch')
          check(release.get('name') == 'Embodied ALife v0.4.0.post8', 'release title mismatch')
          check(release.get('target_commitish') == MERGE, 'release target mismatch')
          check(release.get('draft') is False, 'release is draft')
          check(release.get('prerelease') is False, 'release is prerelease')
          check(latest.get('id') == 359896955 and latest.get('tag_name') == TAG, 'latest stable resolution mismatch')
          check(updater_asset.get('id') == 489911673, 'updater asset ID mismatch')
          check(updater_asset.get('size') == 242052, 'updater asset size mismatch')
          check(updater_asset.get('content_type') == 'application/zip', 'updater content type mismatch')
          check(updater_asset.get('created_at') == updater_asset.get('updated_at'), 'updater asset replacement detected')
          check(checksum_asset.get('id') == 489911677, 'checksum asset ID mismatch')
          check(checksum_asset.get('size') == 92, 'checksum asset size mismatch')
          check(checksum_asset.get('content_type') == 'text/plain', 'checksum content type mismatch')
          check(checksum_asset.get('created_at') == checksum_asset.get('updated_at'), 'checksum asset replacement detected')
          if updater_asset.get('digest'):
              check(updater_asset.get('digest') == f'sha256:{REQUIRED}', 'GitHub updater digest mismatch')

          check(tag_sha == REQUIRED, 'tag-specific updater hash mismatch')
          check(latest_sha == REQUIRED, 'latest updater hash mismatch')
          check(tag_zip.read_bytes() == latest_zip.read_bytes(), 'tag/latest updater bytes differ')
          check(checksum_text == EXPECTED_CHECKSUM, 'checksum text mismatch')
          check(tag_zip.stat().st_size == updater_asset.get('size'), 'public updater size mismatch')
          check(checksum_file.stat().st_size == checksum_asset.get('size'), 'public checksum size mismatch')

          parents = [parent.get('sha') for parent in merge_commit.get('parents', [])]
          check(pr24.get('state') == 'closed' and pr24.get('merged_at') is not None, 'PR 24 not closed/merged')
          check(pr24.get('head', {}).get('sha') == CANDIDATE, 'PR 24 head mismatch')
          check(pr24.get('merge_commit_sha') == MERGE, 'PR 24 merge mismatch')
          check(parents == [BASE, CANDIDATE], 'merge parent order mismatch')
          check(candidate_commit.get('commit', {}).get('tree', {}).get('sha') == TREE, 'candidate tree mismatch')
          check(merge_commit.get('commit', {}).get('tree', {}).get('sha') == TREE, 'merge tree mismatch')
          check(main_branch.get('commit', {}).get('sha') == MERGE, 'main moved beyond required merge')
          check(tag_commit.get('sha') == MERGE, 'tag commit mismatch')
          check(tag_ref.get('object', {}).get('sha') == MERGE or tag_commit.get('sha') == MERGE, 'tag ref mismatch')

          with tempfile.TemporaryDirectory(prefix='post8-audit-retry-') as temp:
              temp_root = Path(temp)
              stage = temp_root / 'stage'
              with zipfile.ZipFile(tag_zip) as archive:
                  bad_member = archive.testzip()
                  infos = archive.infolist()
                  names = [info.filename for info in infos]
                  manifest = json.loads(archive.read('update-manifest.json').decode('utf-8'))
                  managed = manifest.get('managed_paths')
                  unsafe: list[str] = []
                  symlinks: list[str] = []
                  for info in infos:
                      name = info.filename
                      path = PurePosixPath(name)
                      parts = path.parts
                      stem = parts[-1].split('.')[0].upper() if parts else ''
                      if path.is_absolute() or not parts or any(part in {'', '.', '..'} for part in parts) or '\\' in name or '\x00' in name or ':' in parts[0] or stem in RESERVED:
                          unsafe.append(name)
                      mode = info.external_attr >> 16
                      if mode and stat.S_ISLNK(mode):
                          symlinks.append(name)
                  source_mismatches = []
                  for path in managed if isinstance(managed, list) else []:
                      source_file = SOURCE / path
                      if not source_file.is_file() or source_file.read_bytes() != archive.read(path):
                          source_mismatches.append(path)
                  archive.extractall(stage)

              protected = [path for path in managed if path in {'.env','.venv','data','.git'} or path.startswith(('.venv/','data/','.git/'))]
              unexpected = [name for name in names if PurePosixPath(name).suffix.lower() in {'.exe','.dll','.db','.sqlite','.sqlite3','.log','.pem','.key','.pfx','.whl','.tar','.gz','.zip'}]
              temporary = [name for name in names if any(token in name.lower() for token in ('audit-retry-evidence','release-finalization-temp','release-finalization-evidence','controller-payload'))]

              check(bad_member is None, 'public ZIP integrity failure')
              check(len(names) == len(set(names)) == 119, 'public ZIP member count mismatch')
              check(isinstance(managed, list) and len(managed) == 118, 'managed file count mismatch')
              check(set(managed or []) == set(names) - {'update-manifest.json'}, 'manifest/member reconciliation mismatch')
              check(manifest.get('schema_version') == 1, 'manifest schema mismatch')
              check(manifest.get('app_id') == 'embodied-alife', 'manifest app ID mismatch')
              check(manifest.get('version') == '0.4.0.post8', 'manifest version mismatch')
              check(manifest.get('preserved_roots') == ['.env','.venv','data','.git'], 'preserved roots mismatch')
              check(manifest.get('entrypoint') == ['.venv/Scripts/python.exe','-m','app.serve'], 'entrypoint mismatch')
              check(not unsafe and not symlinks and not protected, 'unsafe or protected archive path')
              check(not unexpected and not temporary, 'unexpected runtime/package/evidence member')
              check(not source_mismatches, 'managed source equivalence mismatch')
              check('0.4.0.post8' in (stage / 'app/version.py').read_text(encoding='utf-8'), 'embedded app version mismatch')
              check('version = "0.4.0.post8"' in (stage / 'pyproject.toml').read_text(encoding='utf-8'), 'embedded package version mismatch')

              security_spec = importlib.util.spec_from_file_location('post8_security', SOURCE / 'app/updater/security.py')
              security = importlib.util.module_from_spec(security_spec)
              assert security_spec and security_spec.loader
              security_spec.loader.exec_module(security)
              parsed = security.parse_checksum(checksum_text, 'embodied-alife-update.zip')
              production_manifest = security.inspect_update_archive(tag_zip, max_uncompressed_bytes=200_000_000, expected_version='0.4.0.post8')
              verified_stage = temp_root / 'verified-stage'
              security.extract_update_archive(tag_zip, verified_stage)
              check(parsed == REQUIRED, 'production checksum parser mismatch')
              check(production_manifest.get('version') == '0.4.0.post8', 'production archive validator mismatch')
              check((verified_stage / 'update-manifest.json').is_file(), 'verified staging failed')

              privacy_spec = importlib.util.spec_from_file_location('post8_privacy', SOURCE / 'scripts/privacy_scan.py')
              privacy = importlib.util.module_from_spec(privacy_spec)
              assert privacy_spec and privacy_spec.loader
              privacy_spec.loader.exec_module(privacy)
              privacy_findings = privacy.scan_tree(stage, include_runtime=True)
              privacy_findings += privacy.structured_findings(release, context='release')
              privacy_findings += privacy.string_findings(checksum_text, context='checksum')
              privacy_findings = sorted(set(privacy_findings))
              check(not privacy_findings, 'privacy findings present')

          notes = str(release.get('body') or '')
          lower_notes = notes.lower()
          check('post8 corrections' in lower_notes and 'local installation, migration, and windows validation were not performed' in lower_notes, 'release notes do not accurately describe boundary')
          prohibited_claims = [phrase for phrase in ('v0.4.1 complete','v0.4.1 completed','post9 complete','post9 completed','project acceptance complete','locally validated on windows') if phrase in lower_notes]
          check(not prohibited_claims, 'release notes overclaim unauthorized work')

          check(pr26.get('state') == 'closed' and pr26.get('merged_at') is None, 'PR 26 cleanup mismatch')
          check(pr27.get('state') == 'closed' and pr27.get('merged_at') is None, 'PR 27 cleanup mismatch')
          check(controller_branch.get('commit', {}).get('sha') == CANDIDATE, 'controller branch not reset')
          check(not (SOURCE / '.github/workflows/post8-release-finalization-temp.yml').exists(), 'temporary finalizer workflow remains in tag')
          check(not (SOURCE / '.github/workflows/post8-audit-retry-evidence.yml').exists(), 'temporary audit workflow present in tag')

          historical_releases = [item for item in releases if item.get('tag_name') != TAG]
          historical_tags = [item for item in tags if item.get('name') != TAG]
          published_at = str(release.get('published_at') or '')
          changed_after_post8 = []
          unavailable_assets = []
          for old_release in historical_releases:
              if str(old_release.get('updated_at') or '') > published_at:
                  changed_after_post8.append(f"release:{old_release.get('id')}")
              for asset in old_release.get('assets', []):
                  if str(asset.get('updated_at') or '') > published_at:
                      changed_after_post8.append(f"asset:{asset.get('id')}")
                  url = asset.get('browser_download_url')
                  if url:
                      proc = subprocess.run(['curl','--retry','2','--retry-all-errors','-fsSL','-r','0-0','-o','/dev/null','-w','%{http_code}',url], capture_output=True, text=True)
                      code = proc.stdout.strip()
                      if proc.returncode != 0 or code not in {'200','206'}:
                          unavailable_assets.append({'id': asset.get('id'), 'code': code})

          relevant_history_events = []
          for event in events:
              if str(event.get('created_at') or '') < published_at:
                  continue
              payload = event.get('payload') or {}
              event_type = event.get('type')
              ref = str(payload.get('ref') or '')
              ref_type = payload.get('ref_type')
              if event_type in {'CreateEvent','DeleteEvent'} and ref_type == 'tag' and ref != TAG:
                  relevant_history_events.append({'type': event_type, 'ref': ref, 'created_at': event.get('created_at')})
              if event_type == 'PushEvent' and ref.startswith('refs/tags/') and ref != f'refs/tags/{TAG}':
                  relevant_history_events.append({'type': event_type, 'ref': ref, 'created_at': event.get('created_at')})
              if event_type == 'ReleaseEvent':
                  event_release = payload.get('release') or {}
                  if event_release.get('tag_name') != TAG:
                      relevant_history_events.append({'type': event_type, 'tag': event_release.get('tag_name'), 'action': payload.get('action'), 'created_at': event.get('created_at')})

          check(len(historical_releases) == 18, 'historical Release count mismatch')
          check(len(historical_tags) == 19, 'historical tag count mismatch')
          check(any(item.get('tag_name') == 'v0.4.0.post5' for item in historical_releases), 'Post5 Release not preserved')
          check(not changed_after_post8, 'historical Release or asset changed after Post8')
          check(not unavailable_assets, 'historical asset unavailable')
          check(not relevant_history_events, 'historical tag or Release mutation event after Post8')

          result = {
              'verdict': 'PASS' if not failures else 'FAIL',
              'failures': failures,
              'source_identity': {
                  'candidate': CANDIDATE,
                  'merge': MERGE,
                  'parents': parents,
                  'candidate_tree': candidate_commit.get('commit', {}).get('tree', {}).get('sha'),
                  'merge_tree': merge_commit.get('commit', {}).get('tree', {}).get('sha'),
                  'main': main_branch.get('commit', {}).get('sha'),
                  'tag_commit': tag_commit.get('sha'),
                  'pr24_merged': pr24.get('merged_at') is not None,
              },
              'release': {
                  'id': release.get('id'), 'tag': release.get('tag_name'), 'name': release.get('name'),
                  'target_commitish': release.get('target_commitish'), 'draft': release.get('draft'),
                  'prerelease': release.get('prerelease'), 'created_at': release.get('created_at'),
                  'published_at': release.get('published_at'), 'latest_id': latest.get('id'), 'notes': notes,
              },
              'assets': {
                  'updater': {key: updater_asset.get(key) for key in ('id','name','size','content_type','created_at','updated_at','digest','browser_download_url')},
                  'checksum': {key: checksum_asset.get(key) for key in ('id','name','size','content_type','created_at','updated_at','digest','browser_download_url')},
              },
              'public_bytes': {
                  'tag_updater_sha256': tag_sha,
                  'latest_updater_sha256': latest_sha,
                  'tag_latest_equal': tag_zip.read_bytes() == latest_zip.read_bytes(),
                  'checksum_text': checksum_text,
              },
              'archive': {
                  'members': len(names), 'unique_members': len(set(names)), 'managed_files': len(managed or []),
                  'manifest_keys': sorted(manifest.keys()), 'schema_version': manifest.get('schema_version'),
                  'app_id': manifest.get('app_id'), 'version': manifest.get('version'),
                  'preserved_roots': manifest.get('preserved_roots'), 'entrypoint': manifest.get('entrypoint'),
                  'source_mismatches': source_mismatches, 'unsafe_paths': unsafe, 'symlinks': symlinks,
                  'protected_managed': protected, 'unexpected_members': unexpected, 'temporary_members': temporary,
                  'privacy_findings': privacy_findings, 'production_validator_version': production_manifest.get('version'),
                  'verified_staging_without_install': True,
              },
              'cleanup': {
                  'pr26_closed_unmerged': pr26.get('state') == 'closed' and pr26.get('merged_at') is None,
                  'pr27_closed_unmerged': pr27.get('state') == 'closed' and pr27.get('merged_at') is None,
                  'controller_branch_sha': controller_branch.get('commit', {}).get('sha'),
                  'temporary_workflow_absent_from_tag': not (SOURCE / '.github/workflows/post8-release-finalization-temp.yml').exists(),
              },
              'history': {
                  'release_count_excluding_post8': len(historical_releases),
                  'tag_count_excluding_post8': len(historical_tags),
                  'changed_after_post8': changed_after_post8,
                  'unavailable_assets': unavailable_assets,
                  'mutation_events_after_post8': relevant_history_events,
                  'releases': [{'id': item.get('id'), 'tag': item.get('tag_name'), 'updated_at': item.get('updated_at'), 'assets': [{'id': asset.get('id'), 'name': asset.get('name'), 'size': asset.get('size'), 'updated_at': asset.get('updated_at')} for asset in item.get('assets', [])]} for item in historical_releases],
                  'tags': historical_tags,
              },
          }
          (E / 'audit-results.json').write_text(json.dumps(result, indent=2, sort_keys=True), encoding='utf-8')
          (E / 'sha256sums.txt').write_text(f'{tag_sha}  tag-updater.zip\n{latest_sha}  latest-updater.zip\n', encoding='utf-8')
          print(json.dumps({'verdict': result['verdict'], 'failure_count': len(failures), 'failures': failures}, indent=2))
          if failures:
              raise SystemExit(1)
          PY
          python /tmp/post8_audit_retry.py

      - name: Upload independently inspectable evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: post8-published-byte-audit-retry-evidence
          path: evidence/
          if-no-files-found: error
          retention-days: 30
